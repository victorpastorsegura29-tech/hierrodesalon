<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="robots" content="noindex">
<title>Plantilla de la imagen para compartir (no es una página de la web)</title>
<!-- Plantilla de og.jpg (1200 x 630). Se convierte en imagen con tools/make-images.ps1; no hace falta abrirla a mano. -->
<style>
@font-face{font-family:"Barlow Condensed";font-weight:700;src:url(../fonts/barlow-condensed-700-latin.woff2) format("woff2")}
@font-face{font-family:"Inter";font-weight:400 800;src:url(../fonts/inter-latin.woff2) format("woff2")}
*{box-sizing:border-box}
html,body{margin:0;width:1200px;height:630px;overflow:hidden}
body{position:relative;font-family:Inter,Arial,sans-serif;color:#fff;background:
 radial-gradient(900px 520px at 88% -8%,rgba(45,212,191,.30),transparent 62%),
 radial-gradient(640px 420px at -4% 108%,rgba(245,158,11,.14),transparent 62%),
 repeating-linear-gradient(45deg,rgba(255,255,255,.03) 0 2px,transparent 2px 10px),
 repeating-linear-gradient(-45deg,rgba(255,255,255,.03) 0 2px,transparent 2px 10px),
 #0E1317}
.logo{position:absolute;left:84px;top:74px;width:84px;height:84px}
.kick{position:absolute;left:196px;top:100px;font:700 32px/1 "Barlow Condensed",sans-serif;letter-spacing:.09em;text-transform:uppercase;color:#5EEAD4}
h1{position:absolute;left:78px;top:176px;margin:0;font:700 158px/1 "Barlow Condensed",sans-serif;letter-spacing:.02em;text-transform:uppercase;white-space:nowrap}
h1 em{font-style:normal;color:#5EEAD4}
.slogan{position:absolute;left:84px;top:372px;font:600 42px/1.2 Inter,sans-serif;letter-spacing:-.01em}
.cats{position:absolute;left:84px;top:444px;font:500 29px/1.3 Inter,sans-serif;color:#A9B8C6}
.bar{position:absolute;left:0;right:0;bottom:0;height:68px;background:rgba(94,234,212,.13);border-top:1px solid rgba(94,234,212,.35);display:flex;justify-content:space-between;align-items:center;padding:0 84px;font-size:26px}
.bar b{font-weight:700;color:#fff}
.bar span{color:#A9B8C6;font-weight:500}
</style>
</head>
<body>
<svg class="logo" viewBox="0 0 40 40" aria-hidden="true"><rect width="40" height="40" rx="10" fill="#0E1317" stroke="rgba(255,255,255,.22)" stroke-width=".6"/><g fill="none" stroke="#5EEAD4" stroke-width="3" stroke-linecap="round"><path d="M12 14v12M8 17v6M28 14v12M32 17v6M12 20h16"/></g></svg>
<div class="kick">Comparativas de fitness y fuerza para casa</div>
<h1>Hierro <em>de Salón</em></h1>
<div class="slogan">Compra tu equipo de fuerza una sola vez</div>
<div class="cats">Esterillas · Gomas · Balones · Dominadas · Mancuernas · Bancos</div>
<div class="bar"><b>hierrodesalon.com</b><span>Datos técnicos y para quién es cada producto</span></div>
</body>
</html>
